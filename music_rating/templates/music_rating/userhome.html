{% load static %}
{% now "U" as timestamp %}

<link rel = "stylesheet" href="{% static 'music_rating/general.css' %}">

<!DOCTYPE html>
<html>
    <head>
        <title>Bun Fantano</title>
    </head>
    <body>
        <nav>
            <div class="web_name">
                <a href="{% url 'homepage' %}" class = "active">Good Name</a>
            </div>
            <div class="search_container">
                <input type="text" id="nav_search_bar" class="nav_search_bar" placeholder="Search for a song, artist...">
                <div id="suggestions" class = "suggestions"></div>
            </div>
            <button id="mapToggleBtn">Select Location on Map</button>
            <div class="navbar-links">
                <a href="{% url 'albums' %}">Albums</a>
                <a href="{% url 'artists' %}">Artists</a>
                <a href="{% url 'community' %}">Community Page</a>
                <a href="{% url 'entries' %}">Rating Entries</a>
                <a href="{% url 'songs' %}">Songs</a>
            </div>
        </nav>
        


        <div id="mapContainer" style="height: 500px; display: none;"></div>
        <div id="coordsDisplay"></div>

        
        <script src="{% static 'java_script/search.js' %}?v={{ timestamp }}"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        



    </body>
</html>
